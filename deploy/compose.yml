# The whole upload stack on one machine: `docker compose up -d` in this directory.
# Needs a .env next to this file -- see docs/BETRIEB.md.
name: maqati3

services:
  db:
    # Pinned: `latest` moved to Postgres 18, which cannot read a 17 data directory, and
    # an unpinned image would make that jump on an ordinary `docker compose pull`.
    image: paradedb/paradedb:0.26.3-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: maqati3
      POSTGRES_USER: maqati3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maqati3 -d maqati3"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://maqati3:${POSTGRES_PASSWORD}@db:5432/maqati3
      UPLOAD_KEY: ${UPLOAD_KEY:?set UPLOAD_KEY in .env}
      # Only Caddy can reach this container, and it appends the client's address to
      # X-Forwarded-For; the limit on wrong upload keys needs it to tell clients apart.
      TRUST_FORWARDED_FOR: "true"
      # The admin dashboard's login: all four or none (see docs/BETRIEB.md). Left empty,
      # the dashboard stays closed; set only some of them and the server refuses to start.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Speech to text. Empty closes the transcription button (503) and leaves the
      # worker below refusing to start, which is the state until a key exists.
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
    volumes:
      # The only copy of every upload until an admin registers it. Back this up.
      - staging:/var/lib/maqati3
    depends_on:
      db:
        condition: service_healthy

  # The second process of the same codebase: it takes transcription jobs off the queue.
  # It reads the staged uploads, so it shares the volume; it serves nothing, so Caddy
  # never reaches it. Without SONIOX_API_KEY it exits at once and keeps restarting --
  # visible in `docker compose ps`, and nothing is lost while it is down: the jobs wait.
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "maqati3", "worker"]
    environment:
      DATABASE_URL: postgresql://maqati3:${POSTGRES_PASSWORD}@db:5432/maqati3
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
    volumes:
      - staging:/var/lib/maqati3
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web]

volumes:
  pgdata:
  staging:
  caddy_data:
